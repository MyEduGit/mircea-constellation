# Paperclip — compose definition.
# Run from paperclip/ directory; .env (generated by install script)
# supplies HOST_UID, HOST_GID.
#
# Evidence wiring:
#   Paperclip mounts each peer claw's evidence directory read-only and
#   lists them in EVIDENCE_DIRS so bundle_evidence can sweep all claws
#   from a single invocation.
#
#   Host layout (managed by setup/paperclip_install.sh):
#     /opt/scribeclaw-data/evidence  → read-only, scribeclaw evidence
#     /opt/openclaw-data/evidence    → read-only, openclaw evidence
#     /opt/paperclip-data            → paperclip data root (rw)
#       /opt/paperclip-data/bundles  → produced bundles
#       /opt/paperclip-data/evidence → paperclip's own invocation evidence
#       /opt/paperclip-data/logs     → paperclip logs

services:
  paperclip:
    build:
      context: ..
      dockerfile: paperclip/Dockerfile
      args:
        USER_ID: ${HOST_UID:-1000}
        GROUP_ID: ${HOST_GID:-1000}
    container_name: paperclip
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    environment:
      - CLAW_NAME=Paperclip
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Sweep both peer claws' evidence dirs plus paperclip's own.
      - EVIDENCE_DIRS=/data/evidence/scribeclaw,/data/evidence/openclaw,/data/evidence/paperclip
    volumes:
      # Paperclip's own data root (bundles, logs, self-evidence).
      - /opt/paperclip-data:/data
      # Peer claws — read-only so Paperclip cannot mutate their records.
      - /opt/scribeclaw-data/evidence:/data/evidence/scribeclaw:ro
      - /opt/openclaw-data/evidence:/data/evidence/openclaw:ro
    ports:
      - "127.0.0.1:8083:8083"
    networks:
      - urantios_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true

networks:
  urantios_net:
    driver: bridge
