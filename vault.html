<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mircea's Constellation — Vault</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg: #0a0a1a;
  --bg2: #0f0f28;
  --bg3: rgba(255,255,255,0.04);
  --border: rgba(100,149,237,0.2);
  --accent: #6495ED;
  --accent2: #BB86FC;
  --gold: #FFD700;
  --text: #e0e0e0;
  --muted: #888;
  --dim: #555;
  --green: #4CAF50;
  --sidebar-w: 280px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Header ── */
header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 18px;
  background: rgba(10,10,26,0.95);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  flex-wrap: wrap;
}
header h1 {
  font-size: 1em;
  background: linear-gradient(90deg, #6495ED, #DDA0DD, #FFD700);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 2px;
  white-space: nowrap;
}
header .breadcrumb { font-size: 0.72em; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#search {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 10px;
  color: var(--text);
  font-size: 0.75em;
  width: 200px;
  outline: none;
}
#search:focus { border-color: var(--accent); }
.back-btn {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 10px;
  color: var(--accent);
  font-size: 0.72em;
  cursor: pointer;
  white-space: nowrap;
  display: none;
}
.back-btn:hover { background: rgba(100,149,237,0.1); }

/* ── Body layout ── */
.body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  background: var(--bg2);
  display: flex;
  flex-direction: column;
}
.sidebar-section { padding: 10px 0; border-bottom: 1px solid var(--border); }
.sidebar-section-title {
  font-size: 0.6em;
  letter-spacing: 2px;
  color: var(--dim);
  text-transform: uppercase;
  padding: 0 14px 6px;
}
.source-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  cursor: pointer;
  font-size: 0.75em;
  color: var(--muted);
  border-left: 3px solid transparent;
  transition: all 0.15s;
}
.source-item:hover { background: var(--bg3); color: var(--text); }
.source-item.active { color: var(--accent); border-left-color: var(--accent); background: rgba(100,149,237,0.07); }
.source-icon { font-size: 1.1em; }
.source-count { margin-left: auto; font-size: 0.85em; color: var(--dim); background: var(--bg3); padding: 1px 5px; border-radius: 8px; }

/* ── Note list ── */
.note-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}
.date-group { padding: 4px 0; }
.date-header {
  font-size: 0.6em;
  letter-spacing: 2px;
  color: var(--dim);
  text-transform: uppercase;
  padding: 4px 14px;
  position: sticky;
  top: 0;
  background: var(--bg2);
}
.note-item {
  padding: 7px 14px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all 0.15s;
}
.note-item:hover { background: var(--bg3); }
.note-item.active { border-left-color: var(--accent); background: rgba(100,149,237,0.07); }
.note-title { font-size: 0.75em; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-meta { font-size: 0.62em; color: var(--dim); margin-top: 2px; display: flex; gap: 8px; }
.badge {
  display: inline-block;
  padding: 1px 5px;
  border-radius: 4px;
  font-size: 0.78em;
}
.badge-1 { background: rgba(244,67,54,0.15); color: #f44336; }
.badge-2 { background: rgba(255,193,7,0.15); color: #FFC107; }
.badge-3 { background: rgba(100,149,237,0.15); color: #6495ED; }

/* ── Content pane ── */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 24px 32px;
  max-width: 820px;
}
.content.loading { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.85em; }
.placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 12px;
  color: var(--dim);
  text-align: center;
}
.placeholder .big { font-size: 3em; }
.placeholder p { font-size: 0.8em; max-width: 340px; line-height: 1.6; }
.placeholder .links { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.placeholder .links a {
  font-size: 0.72em;
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--accent);
}
.placeholder .links a:hover { background: rgba(100,149,237,0.1); }

/* ── Frontmatter card ── */
.fm-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 24px;
  font-size: 0.72em;
}
.fm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px 16px; }
.fm-row { display: flex; gap: 6px; }
.fm-key { color: var(--muted); min-width: 100px; flex-shrink: 0; }
.fm-val { color: var(--text); word-break: break-all; }
.fm-title { font-size: 1.1em; color: var(--accent); margin-bottom: 8px; font-weight: 600; }

/* ── Markdown styles ── */
.md-body { font-size: 0.88em; line-height: 1.7; }
.md-body h1 { font-size: 1.5em; color: var(--accent); margin: 0 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.md-body h2 { font-size: 1.1em; color: var(--accent2); margin: 24px 0 10px; }
.md-body h3 { font-size: 0.95em; color: #DDA0DD; margin: 16px 0 8px; }
.md-body p { margin: 0 0 12px; }
.md-body ul, .md-body ol { margin: 0 0 12px 20px; }
.md-body li { margin: 3px 0; }
.md-body code { background: rgba(255,255,255,0.07); padding: 2px 5px; border-radius: 3px; font-size: 0.9em; font-family: 'Courier New', monospace; color: #FFD700; }
.md-body pre { background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 6px; padding: 14px; overflow-x: auto; margin: 0 0 14px; }
.md-body pre code { background: none; padding: 0; color: #e0e0e0; }
.md-body blockquote { border-left: 3px solid var(--accent); padding-left: 14px; color: var(--muted); margin: 0 0 12px; }
.md-body table { width: 100%; border-collapse: collapse; margin: 0 0 14px; font-size: 0.9em; }
.md-body th { background: rgba(100,149,237,0.1); padding: 6px 10px; text-align: left; border: 1px solid var(--border); color: var(--accent); }
.md-body td { padding: 5px 10px; border: 1px solid var(--border); }
.md-body hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
.md-body a { color: var(--accent); }

/* ── Stats bar ── */
.stats-bar {
  padding: 6px 18px;
  background: rgba(10,10,26,0.9);
  border-top: 1px solid var(--border);
  font-size: 0.62em;
  color: var(--dim);
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  flex-shrink: 0;
}
.stats-bar span { display: flex; align-items: center; gap: 4px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 5px var(--green); display: inline-block; }

/* ── Error ── */
.error-box { background: rgba(244,67,54,0.1); border: 1px solid rgba(244,67,54,0.3); border-radius: 6px; padding: 12px 16px; color: #f44336; font-size: 0.8em; margin-bottom: 16px; }

/* ── Responsive ── */
@media (max-width: 640px) {
  .sidebar { display: none; }
  .content { padding: 16px; }
}
</style>
</head>
<body>

<header>
  <h1>CONSTELLATION VAULT</h1>
  <span class="breadcrumb" id="breadcrumb">All sources</span>
  <button class="back-btn" id="backBtn" onclick="goBack()">← Back</button>
  <input type="search" id="search" placeholder="Search notes…" oninput="filterNotes(this.value)">
</header>

<div class="body">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-section-title">Navigation</div>
      <div id="pinnedList">
        <div class="source-item" id="pin-dashboard" onclick="openDashboard()">
          <span class="source-icon">🏠</span>
          <span>Dashboard</span>
        </div>
        <div class="source-item" id="pin-sysmap" onclick="openSystemMap()">
          <span class="source-icon">🗺</span>
          <span>System Map</span>
        </div>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">Sources</div>
      <div id="sourceList"></div>
    </div>
    <div class="note-list" id="noteList"></div>
  </div>

  <!-- Content -->
  <div class="content" id="content">
    <div style="padding:40px;color:var(--muted);font-size:0.8em;text-align:center">Loading dashboard…</div>
  </div>

</div>

<div class="stats-bar" id="statsBar">
  <span><span class="dot"></span> Vault Browser — live from GitHub</span>
  <span id="statCount">Loading…</span>
  <span id="statLast"></span>
  <span>
    <a href="https://github.com/MyEduGit/mircea-constellation" target="_blank" style="color:var(--dim)">myedugit/mircea-constellation</a>
  </span>
</div>

<script>
const OWNER = 'MyEduGit';
const REPO  = 'mircea-constellation';
const API   = `https://api.github.com/repos/${OWNER}/${REPO}`;
const RAW   = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main`;

// Source folders in the repo mapped from perpetual-capture structure
const SOURCES = [
  { id: 'jobs',      path: 'jobs',                    icon: '📋', label: 'Job Archives',   desc: 'Completed Claude Code jobs (/doc)' },
  { id: 'claude',    path: 'vault/00_Inbox/Claude',   icon: '🤖', label: 'Claude Code',    desc: 'Session transcripts' },
  { id: 'chatgpt',   path: 'vault/00_Inbox/ChatGPT',  icon: '💬', label: 'ChatGPT',        desc: 'Exported conversations' },
  { id: 'n8n',       path: 'vault/00_Inbox/n8n',      icon: '⚙️',  label: 'n8n / Council',  desc: 'Workflow execution logs' },
  { id: 'telegram',  path: 'vault/00_Inbox/Telegram', icon: '✈️',  label: 'Telegram',       desc: 'Chat exports' },
  { id: 'terminal',  path: 'vault/00_Inbox/Terminal', icon: '💻', label: 'Terminal',        desc: 'Shell history snapshots' },
  { id: 'drops',     path: 'vault/00_Inbox/AI_Captures', icon: '📥', label: 'AI Captures', desc: 'Manual drops & imports' },
];

let allNotes = [];   // { source, date, slug, path, title, meta }
let filtered = [];
let activeSource = null;
let activeNote  = null;
let activePin   = null;   // 'dashboard' | 'sysmap' | null

// ── Bootstrap ────────────────────────────────────────────────────────────────
async function init() {
  renderSources([]);
  await openDashboard();           // land on the dashboard immediately
  loadAllSources();                // load sources in background (non-blocking)
}

async function loadAllSources() {
  const results = await Promise.allSettled(SOURCES.map(s => loadSource(s)));
  renderSources(SOURCES);
  renderNoteList(allNotes);
  document.getElementById('statCount').textContent = `${allNotes.length} notes`;
  if (allNotes.length) {
    const last = allNotes[0];
    document.getElementById('statLast').textContent = `Latest: ${last.date || last.slug}`;
  }
}

async function loadSource(source) {
  let items = [];
  try {
    const res  = await fetch(`${API}/contents/${source.path}`);
    if (!res.ok) return;
    const data = await res.json();

    if (source.id === 'jobs') {
      // jobs/ → date dirs → slug dirs → job.md
      const dates = data.filter(d => d.type === 'dir').sort((a,b) => b.name.localeCompare(a.name));
      for (const dateDir of dates) {
        const res2 = await fetch(`${API}/contents/${source.path}/${dateDir.name}`);
        if (!res2.ok) continue;
        const slugs = await res2.json();
        for (const slugDir of slugs.filter(d => d.type === 'dir')) {
          items.push({
            source: source.id,
            sourceIcon: source.icon,
            sourceLabel: source.label,
            date: dateDir.name,
            slug: slugDir.name,
            path: `${source.path}/${dateDir.name}/${slugDir.name}/job.md`,
            title: slugDir.name.replace(/-/g, ' '),
            meta: {}
          });
        }
      }
    } else {
      // flat .md files
      for (const f of data.filter(f => f.name.endsWith('.md') && f.name !== 'PERPETUAL_CAPTURE_INDEX.md')) {
        items.push({
          source: source.id,
          sourceIcon: source.icon,
          sourceLabel: source.label,
          date: f.name.slice(0, 10),
          slug: f.name.replace(/\.md$/, ''),
          path: `${source.path}/${f.name}`,
          title: f.name.replace(/\.md$/, '').replace(/_/g, ' '),
          meta: {}
        });
      }
    }
  } catch (e) { /* source folder may not exist yet */ }

  source._count = items.length;
  allNotes = [...items, ...allNotes];
  allNotes.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  filtered = [...allNotes];
}

// ── Pinned pages (Dashboard, System Map) ─────────────────────────────────────
function setActivePin(id) {
  activePin    = id;
  activeNote   = null;
  activeSource = null;
  document.querySelectorAll('#pinnedList .source-item').forEach(el => el.classList.remove('active'));
  if (id) {
    const el = document.getElementById(`pin-${id}`);
    if (el) el.classList.add('active');
  }
  document.getElementById('backBtn').style.display = 'none';
  renderSources(SOURCES);
  renderNoteList(filtered.length ? filtered : allNotes);
}

async function openDashboard() {
  setActivePin('dashboard');
  document.getElementById('breadcrumb').textContent = 'Dashboard';
  await openStaticPage('vault/DASHBOARD.md', 'Dashboard');
}

async function openSystemMap() {
  setActivePin('sysmap');
  document.getElementById('breadcrumb').textContent = 'System Map';
  await openStaticPage('vault/01_System/SYSTEM_MAP.md', 'System Map');
}

async function openStaticPage(path, title) {
  const content = document.getElementById('content');
  content.innerHTML = '<div style="padding:40px;color:var(--muted);font-size:0.8em;text-align:center">Loading…</div>';
  try {
    const res = await fetch(`${RAW}/${path}`);
    if (!res.ok) throw new Error(`${res.status} — ${path} not found in repo yet`);
    const md = await res.text();
    renderNote(md, path, title, '');
  } catch (e) {
    content.innerHTML = `<div class="error-box">${escHtml(e.message)}</div>
      <div class="md-body" style="padding:0 0 32px">
        <p>The file <code>${path}</code> has not been committed to the repository yet.</p>
        <p>It will appear here after merging PR <a href="https://github.com/${OWNER}/${REPO}/pulls" target="_blank">#65</a> to <code>main</code>.</p>
      </div>`;
  }
}

// ── Sidebar: sources ─────────────────────────────────────────────────────────
function renderSources(sources) {
  const el = document.getElementById('sourceList');
  el.innerHTML = sources.map(s => `
    <div class="source-item ${activeSource === s.id ? 'active' : ''}" onclick="selectSource('${s.id}')">
      <span class="source-icon">${s.icon}</span>
      <span>${s.label}</span>
      <span class="source-count">${s._count !== undefined ? s._count : '…'}</span>
    </div>
  `).join('') + `
    <div class="source-item ${activeSource === null ? 'active' : ''}" onclick="selectSource(null)" style="margin-top:4px;border-top:1px solid rgba(255,255,255,0.05);padding-top:10px">
      <span class="source-icon">🌌</span>
      <span>All sources</span>
      <span class="source-count">${allNotes.length || '…'}</span>
    </div>
  `;
}

function selectSource(id) {
  activeSource = id;
  activePin    = null;
  document.querySelectorAll('#pinnedList .source-item').forEach(el => el.classList.remove('active'));
  filtered = id ? allNotes.filter(n => n.source === id) : [...allNotes];
  document.getElementById('search').value = '';
  renderSources(SOURCES);
  renderNoteList(filtered);
  document.getElementById('breadcrumb').textContent =
    id ? (SOURCES.find(s=>s.id===id)||{label:id}).label : 'All sources';
  if (!id) {
    document.getElementById('content').innerHTML = `
      <div class="placeholder">
        <div class="big">🌌</div>
        <p>Select a note from the sidebar, or click Dashboard to return home.</p>
        <div class="links"><a href="javascript:void(0)" onclick="openDashboard()">Dashboard</a></div>
      </div>`;
  }
}

// ── Note list ─────────────────────────────────────────────────────────────────
function renderNoteList(notes) {
  const el = document.getElementById('noteList');
  if (!notes.length) {
    el.innerHTML = '<div style="padding:20px 14px;font-size:0.72em;color:var(--dim);text-align:center">No notes yet.<br>Run backup-all.sh to populate.</div>';
    return;
  }
  // Group by date
  const byDate = {};
  for (const n of notes) {
    const d = n.date || 'misc';
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(n);
  }
  el.innerHTML = Object.keys(byDate).sort((a,b)=>b.localeCompare(a)).map(date => `
    <div class="date-group">
      <div class="date-header">${date}</div>
      ${byDate[date].map(n => `
        <div class="note-item ${activeNote === n.path ? 'active' : ''}" onclick="openNote('${escHtml(n.path)}', '${escHtml(n.title)}', '${n.date}')">
          <div class="note-title">${n.sourceIcon} ${escHtml(n.title)}</div>
          <div class="note-meta">
            <span>${n.sourceLabel}</span>
            ${n.meta.priority ? `<span class="badge badge-${n.meta.priority.slice(-1)}">${n.meta.priority}</span>` : ''}
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

function filterNotes(q) {
  const base = activeSource ? allNotes.filter(n => n.source === activeSource) : allNotes;
  filtered = q ? base.filter(n =>
    n.title.toLowerCase().includes(q.toLowerCase()) ||
    n.date.includes(q) ||
    n.slug.includes(q.toLowerCase())
  ) : base;
  renderNoteList(filtered);
}

// ── Open note ─────────────────────────────────────────────────────────────────
async function openNote(path, title, date) {
  activeNote = path;
  activePin  = null;
  document.querySelectorAll('#pinnedList .source-item').forEach(el => el.classList.remove('active'));
  renderNoteList(filtered);
  document.getElementById('breadcrumb').textContent = title;
  document.getElementById('backBtn').style.display = 'inline-block';

  const content = document.getElementById('content');
  content.innerHTML = '<div style="padding:40px;color:var(--muted);font-size:0.8em">Loading…</div>';

  try {
    const res = await fetch(`${RAW}/${path}`);
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    const md = await res.text();
    renderNote(md, path, title, date);
  } catch (e) {
    content.innerHTML = `<div class="error-box">Could not load note: ${e.message}<br><small>${RAW}/${path}</small></div>`;
  }
}

function renderNote(raw, path, title, date) {
  // Strip YAML frontmatter and parse it
  const fm = {};
  let body = raw;
  const fmMatch = raw.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
  if (fmMatch) {
    body = fmMatch[2];
    for (const line of fmMatch[1].split('\n')) {
      const m = line.match(/^(\w[\w_-]*):\s*(.+)$/);
      if (m) fm[m[1]] = m[2].trim();
    }
  }

  const fmRows = Object.entries(fm).filter(([k]) =>
    ['capture_id','source','host_device','priority','status','verification_status','checksum'].includes(k)
  );

  const content = document.getElementById('content');
  content.innerHTML = `
    ${fmRows.length ? `
    <div class="fm-card">
      <div class="fm-title">${fm.topic || title}</div>
      <div class="fm-grid">
        ${fmRows.map(([k,v]) => `
          <div class="fm-row">
            <span class="fm-key">${k}</span>
            <span class="fm-val">${escHtml(v)}</span>
          </div>
        `).join('')}
      </div>
    </div>` : ''}
    <div class="md-body">${marked.parse(body)}</div>
    <div style="margin-top:32px;padding-top:16px;border-top:1px solid var(--border);font-size:0.7em;color:var(--dim);display:flex;gap:16px;flex-wrap:wrap">
      <a href="${RAW}/${path}" target="_blank">View raw</a>
      <a href="https://github.com/${OWNER}/${REPO}/blob/main/${path}" target="_blank">View on GitHub</a>
      <span>Path: ${path}</span>
    </div>
  `;
}

function goBack() {
  activeNote = null;
  document.getElementById('backBtn').style.display = 'none';
  if (activePin) {
    // return to pinned page
    if (activePin === 'dashboard') openDashboard();
    else if (activePin === 'sysmap') openSystemMap();
  } else if (activeSource) {
    document.getElementById('breadcrumb').textContent =
      (SOURCES.find(s=>s.id===activeSource)||{label:activeSource}).label;
    renderNoteList(filtered);
    document.getElementById('content').innerHTML = `
      <div class="placeholder"><div class="big">🌌</div>
      <p>Select a note from the sidebar.</p></div>`;
  } else {
    openDashboard();
  }
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
</body>
</html>
